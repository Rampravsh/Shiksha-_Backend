components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter Bearer access token to authenticate API requests.

  schemas:
    ErrorResponse:
      type: object
      required:
        - success
        - statusCode
        - message
        - timestamp
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: Invalid request parameters
        errors:
          type: array
          items:
            type: object
          example: []
        timestamp:
          type: string
          format: date-time
          example: "2026-08-07T00:00:00.000Z"
        requestId:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000

security:
  - bearerAuth: []
