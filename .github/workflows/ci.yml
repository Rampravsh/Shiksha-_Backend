name: Shiksha+ Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    name: Code Quality, TypeCheck, Lint & Unit Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public"
      JWT_ACCESS_SECRET: "ci_access_secret_key_32_characters_minimum"
      JWT_REFRESH_SECRET: "ci_refresh_secret_key_32_characters_minimum"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔄 Generate Prisma Client
        run: npx prisma generate

      - name: 🧹 Linting Check (ESLint)
        run: npm run lint

      - name: 📐 Type Check & TypeScript Compilation
        run: npm run build

      - name: 🧪 Run Jest Test Suites
        run: npm test

  docker-build:
    name: Production Docker Container Build
    needs: audit-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: shiksha-api:latest
